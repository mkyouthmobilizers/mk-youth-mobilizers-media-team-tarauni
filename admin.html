<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MK Youth Mobilizers - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#222;
  padding:20px;
}

.container{
  max-width:850px;
  margin:20px auto;
}

.box{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.1);
  margin-bottom:25px;
}

h1{
  color:#075b32;
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

input[type="file"]{
  background:#f5f5f5;
}

button{
  border:0;
  border-radius:8px;
  padding:13px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#999 !important;
  cursor:not-allowed;
}

/* LOGIN */

#loginBox{
  max-width:500px;
  margin:60px auto;
}

.login-btn{
  width:100%;
  margin-top:20px;
  background:#075b32;
  color:white;
  font-size:17px;
}

.forgot{
  display:block;
  text-align:center;
  margin-top:15px;
  color:#075b32;
  cursor:pointer;
  font-weight:bold;
}

#adminArea{
  display:none;
}

/* FORM */

#publishBtn{
  width:100%;
  margin-top:20px;
  background:#075b32;
  color:white;
  font-size:17px;
}

.preview{
  margin-top:15px;
  text-align:center;
}

.preview img,
.preview video{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:10px;
}

.message{
  margin-top:18px;
  text-align:center;
  font-weight:bold;
  line-height:1.5;
  word-break:break-word;
}

.success{
  color:#087f23;
}

.error{
  color:#b00020;
}

/* POSTS */

.posts-title{
  color:#075b32;
  margin-bottom:20px;
  text-align:center;
}

.post-card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:18px;
}

.post-card h3{
  color:#075b32;
  margin-bottom:8px;
}

.post-card p{
  white-space:pre-wrap;
  line-height:1.5;
  color:#555;
  margin-bottom:12px;
}

.post-card img,
.post-card video{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:10px;
}

.edit-btn{
  background:#075b32;
  color:white;
  flex:1;
}

.delete-btn{
  background:#b00020;
  color:white;
  flex:1;
}

.logout-btn{
  background:#b00020;
  color:white;
  width:100%;
  margin-bottom:20px;
}

.cancel-btn{
  background:#777;
  color:white;
  width:100%;
  margin-top:10px;
  display:none;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#075b32;
  text-decoration:none;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginBox" class="box">

<h1>MK Youth Mobilizers</h1>

<p class="subtitle">
Admin Login
</p>

<label for="loginEmail">
Admin Gmail
</label>

<input
  type="email"
  id="loginEmail"
  placeholder="Enter admin Gmail"
  autocomplete="email"
>

<label for="loginPassword">
Password
</label>

<input
  type="password"
  id="loginPassword"
  placeholder="Enter password"
  autocomplete="current-password"
>

<button
  id="loginBtn"
  class="login-btn"
>
Login
</button>

<div
  id="loginMessage"
  class="message"
></div>

<div
  id="forgotBtn"
  class="forgot"
>
Forgot Password?
</div>

</div>


<!-- =========================
     ADMIN AREA
========================= -->

<div id="adminArea">

<div class="container">

<button
  id="logoutBtn"
  class="logout-btn"
>
🚪 Logout
</button>


<!-- CREATE / EDIT -->

<div class="box">

<h1>
MK Youth Mobilizers
</h1>

<p
  class="subtitle"
  id="formTitle"
>
Create a new post
</p>


<label for="title">
Post Title
</label>

<input
  type="text"
  id="title"
  placeholder="Enter post title"
>


<label for="content">
Post Content
</label>

<textarea
  id="content"
  placeholder="Write your post here..."
></textarea>


<label for="media">
Choose Photo or Video
</label>

<input
  type="file"
  id="media"
  accept="image/*,video/*"
>


<div
  id="preview"
  class="preview"
></div>


<button
  id="publishBtn"
>
Publish Post
</button>


<button
  id="cancelBtn"
  class="cancel-btn"
>
Cancel Edit
</button>


<div
  id="message"
  class="message"
></div>

</div>


<!-- MANAGE POSTS -->

<div class="box">

<h2 class="posts-title">
Manage Posts
</h2>

<div id="posts">

<div class="empty">
Loading posts...
</div>

</div>

</div>


<a
  class="back"
  href="index.html"
>
← Back to Website
</a>

</div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const BUCKET =
"post-media";


const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const loginBox =
document.getElementById("loginBox");

const adminArea =
document.getElementById("adminArea");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");

const forgotBtn =
document.getElementById("forgotBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const titleInput =
document.getElementById("title");

const contentInput =
document.getElementById("content");

const mediaInput =
document.getElementById("media");

const preview =
document.getElementById("preview");

const publishBtn =
document.getElementById("publishBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const message =
document.getElementById("message");

const postsContainer =
document.getElementById("posts");

const formTitle =
document.getElementById("formTitle");


/* =========================
   EDIT STATE
========================= */

let editingId = null;

let oldMediaUrl = null;


/* =========================
   MESSAGE
========================= */

function showLoginMessage(
  text,
  type
){

  loginMessage.textContent =
  text;

  loginMessage.className =
  "message " + type;

}


function showMessage(
  text,
  type
){

  message.textContent =
  text;

  message.className =
  "message " + type;

}


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
"click",
async function(){

  const email =
  loginEmail.value.trim();

  const password =
  loginPassword.value;


  if(!email){

    showLoginMessage(
      "Please enter your Gmail.",
      "error"
    );

    return;
  }


  if(!password){

    showLoginMessage(
      "Please enter your password.",
      "error"
    );

    return;
  }


  loginBtn.disabled =
  true;

  showLoginMessage(
    "Logging in...",
    "success"
  );


  const result =
  await client.auth.signInWithPassword({
    email:email,
    password:password
  });


  if(result.error){

    showLoginMessage(
      "❌ " + result.error.message,
      "error"
    );

    loginBtn.disabled =
    false;

    return;
  }


  showLoginMessage(
    "✅ Login successful!",
    "success"
  );


  setTimeout(
    function(){

      showAdmin();

    },
    500
  );


  loginBtn.disabled =
  false;

});


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  loginBox.style.display =
  "none";

  adminArea.style.display =
  "block";

  loadPosts();

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession(){

  const result =
  await client.auth.getSession();

  if(result.data.session){

    showAdmin();

  }
  else{

    loginBox.style.display =
    "block";

    adminArea.style.display =
    "none";

  }

}


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
"click",
async function(){

  await client.auth.signOut();

  adminArea.style.display =
  "none";

  loginBox.style.display =
  "block";

  loginPassword.value =
  "";

  showLoginMessage(
    "You have been logged out.",
    "success"
  );

});


/* =========================
   FORGOT PASSWORD
========================= */

forgotBtn.addEventListener(
"click",
async function(){

  const email =
  loginEmail.value.trim();


  if(!email){

    showLoginMessage(
      "Enter your Gmail first.",
      "error"
    );

    return;
  }


  const redirectUrl =
  window.location.origin +
  window.location.pathname;


  const result =
  await client.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:redirectUrl
    }
  );


  if(result.error){

    showLoginMessage(
      "❌ " + result.error.message,
      "error"
    );

    return;
  }


  showLoginMessage(
    "✅ Password recovery email sent. Check your Gmail.",
    "success"
  );

});


/* =========================
   MEDIA PREVIEW
========================= */

mediaInput.addEventListener(
"change",
function(){

  preview.innerHTML = "";

  const file =
  mediaInput.files[0];

  if(!file){
    return;
  }


  if(
    file.size >
    50 * 1024 * 1024
  ){

    showMessage(
      "File is larger than 50 MB.",
      "error"
    );

    mediaInput.value =
    "";

    return;
  }


  const url =
  URL.createObjectURL(file);


  if(
    file.type.startsWith("image/")
  ){

    const img =
    document.createElement("img");

    img.src =
    url;

    preview.appendChild(
      img
    );

  }


  else if(
    file.type.startsWith("video/")
  ){

    const video =
    document.createElement("video");

    video.src =
    url;

    video.controls =
    true;

    preview.appendChild(
      video
    );

  }

});


/* =========================
   UPLOAD MEDIA
========================= */

async function uploadMedia(file){

  const safeName =
  file.name.replace(
    /[^a-zA-Z0-9.-]/g,
    "-"
  );


  const fileName =
  Date.now() +
  "-" +
  safeName;


  const result =
  await client.storage
  .from(BUCKET)
  .upload(
    fileName,
    file,
    {
      cacheControl:"3600",
      upsert:false,
      contentType:file.type
    }
  );


  if(result.error){

    throw new Error(
      "Storage upload failed: " +
      result.error.message
    );

  }


  return client.storage
  .from(BUCKET)
  .getPublicUrl(
    fileName
  )
  .data
  .publicUrl;

}


/* =========================
   PUBLISH / UPDATE
========================= */

publishBtn.addEventListener(
"click",
async function(){

  const title =
  titleInput.value.trim();

  const content =
  contentInput.value.trim();

  const file =
  mediaInput.files[0];


  if(!title){

    showMessage(
      "Please enter a post title.",
      "error"
    );

    return;
  }


  if(!content){

    showMessage(
      "Please enter post content.",
      "error"
    );

    return;
  }


  publishBtn.disabled =
  true;


  try{

    let mediaUrl =
    oldMediaUrl;


    if(file){

      showMessage(
        "Uploading media...",
        "success"
      );

      mediaUrl =
      await uploadMedia(
        file
      );

    }


    /* UPDATE */

    if(editingId){

      const result =
      await client
      .from("posts")
      .update({

        Title:title,

        Content:content,

        Image_url:mediaUrl

      })
      .eq(
        "id",
        editingId
      );


      if(result.error){

        throw new Error(
          "Update failed: " +
          result.error.message
        );

      }


      showMessage(
        "✅ Post updated successfully!",
        "success"
      );

    }


    /* NEW POST */

    else{

      const result =
      await client
      .from("posts")
      .insert([{

        Title:title,

        Content:content,

        Image_url:
        mediaUrl || null

      }]);


      if(result.error){

        throw new Error(
          "Database error: " +
          result.error.message
        );

      }


      showMessage(
        "✅ Post published successfully!",
        "success"
      );

    }


    resetForm();

    loadPosts();

  }

  catch(error){

    console.error(error);

    showMessage(
      "❌ " + error.message,
      "error"
    );

  }


  publishBtn.disabled =
  false;

});


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  postsContainer.innerHTML =
  '<div class="empty">Loading posts...</div>';


  const result =
  await client
  .from("posts")
  .select("*")
  .order(
    "id",
    {
      ascending:false
    }
  );


  if(result.error){

    postsContainer.innerHTML =
    `<div class="empty">
      ❌ ${escapeHtml(
        result.error.message
      )}
    </div>`;

    return;
  }


  const posts =
  result.data || [];


  if(posts.length === 0){

    postsContainer.innerHTML =
    '<div class="empty">No posts yet.</div>';

    return;

  }


  postsContainer.innerHTML =
  "";


  posts.forEach(
  function(post){

    const card =
    document.createElement("div");

    card.className =
    "post-card";


    /* MEDIA */

    if(post.Image_url){

      const url =
      post.Image_url;

      const lower =
      url.toLowerCase();


      if(
        lower.includes(".mp4") ||
        lower.includes(".webm") ||
        lower.includes(".mov") ||
        lower.includes(".m4v")
      ){

        const video =
        document.createElement("video");

        video.src =
        url;

        video.controls =
        true;

        card.appendChild(
          video
        );

      }

      else{

        const img =
        document.createElement("img");

        img.src =
        url;

        img.alt =
        post.Title || "Post";

        card.appendChild(
          img
        );

      }

    }


    const title =
    document.createElement("h3");

    title.textContent =
    post.Title ||
    "Untitled Post";


    const content =
    document.createElement("p");

    content.textContent =
    post.Content || "";


    card.appendChild(
      title
    );

    card.appendChild(
      content
    );


    /* ACTIONS */

    const actions =
    document.createElement("div");

    actions.className =
    "actions";


    const editBtn =
    document.createElement("button");

    editBtn.className =
    "edit-btn";

    editBtn.textContent =
    "✏️ Edit";

    editBtn.onclick =
    function(){

      startEdit(post);

    };


    const deleteBtn =
    document.createElement("button");

    deleteBtn.className =
    "delete-btn";

    deleteBtn.textContent =
    "🗑️ Delete";

    deleteBtn.onclick =
    function(){

      deletePost(post);

    };


    actions.appendChild(
      editBtn
    );

    actions.appendChild(
      deleteBtn
    );


    card.appendChild(
      actions
    );


    postsContainer.appendChild(
      card
    );

  });

}


/* =========================
   EDIT
========================= */

function startEdit(post){

  editingId =
  post.id;

  oldMediaUrl =
  post.Image_url || null;


  titleInput.value =
  post.Title || "";

  contentInput.value =
  post.Content || "";

  mediaInput.value =
  "";

  formTitle.textContent =
  "Edit Post";

  publishBtn.textContent =
  "Update Post";

  cancelBtn.style.display =
  "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   CANCEL
========================= */

cancelBtn.addEventListener(
"click",
function(){

  resetForm();

});


function resetForm(){

  editingId =
  null;

  oldMediaUrl =
  null;

  titleInput.value =
  "";

  contentInput.value =
  "";

  mediaInput.value =
  "";

  preview.innerHTML =
  "";

  formTitle.textContent =
  "Create a new post";

  publishBtn.textContent =
  "Publish Post";

  cancelBtn.style.display =
  "none";

}


/* =========================
   DELETE
========================= */

async function deletePost(post){

  const confirmed =
  confirm(
    "Are you sure you want to delete this post?"
  );


  if(!confirmed){
    return;
  }


  const result =
  await client
  .from("posts")
  .delete()
  .eq(
    "id",
    post.id
  );


  if(result.error){

    showMessage(
      "❌ Delete failed: " +
      result.error.message,
      "error"
    );

    return;
  }


  showMessage(
    "✅ Post deleted successfully.",
    "success"
  );


  loadPosts();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  const div =
  document.createElement("div");

  div.textContent =
  text;

  return div.innerHTML;

}


/* =========================
   START
========================= */

checkSession();

</script>

</body>
</html>
