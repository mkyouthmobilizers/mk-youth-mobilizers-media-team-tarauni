<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MK Youth Mobilizers Admin</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  padding:20px;
}

.box{
  max-width:600px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
}

h1{
  color:#075b32;
}

input,textarea{
  width:100%;
  padding:14px;
  margin-top:10px;
  margin-bottom:15px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:15px;
  background:#075b32;
  color:white;
  border:0;
  border-radius:8px;
  font-size:17px;
}
</style>
</head>

<body>

<div class="box">

<h1>MK Youth Mobilizers</h1>

<p>Admin Post Page</p>

<input type="text" placeholder="Post Title">

<textarea placeholder="Write your post here..."></textarea>

<input type="file">

<button>Publish Post</button>

<p>Admin page is working ✅</p>

</div>

</body>
</html>
