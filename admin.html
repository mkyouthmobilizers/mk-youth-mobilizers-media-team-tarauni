<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const BUCKET =
"post-media";

const { createClient } =
supabase;

const client =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const titleInput =
document.getElementById("title");

const contentInput =
document.getElementById("content");

const mediaInput =
document.getElementById("media");

const preview =
document.getElementById("preview");

const publishBtn =
document.getElementById("publishBtn");

const message =
document.getElementById("message");


/* =========================
   PREVIEW
========================= */

mediaInput.addEventListener(
"change",
function(){

  preview.innerHTML = "";

  const file =
  mediaInput.files[0];

  if(!file) return;

  if(file.size > 50 * 1024 * 1024){

    showMessage(
      "File is larger than 50 MB.",
      "error"
    );

    mediaInput.value = "";
    return;
  }

  const url =
  URL.createObjectURL(file);

  if(file.type.startsWith("image/")){

    const img =
    document.createElement("img");

    img.src = url;

    preview.appendChild(img);

  }

  else if(file.type.startsWith("video/")){

    const video =
    document.createElement("video");

    video.src = url;
    video.controls = true;

    preview.appendChild(video);
  }

});


/* =========================
   PUBLISH
========================= */

publishBtn.addEventListener(
"click",
async function(){

  const title =
  titleInput.value.trim();

  const content =
  contentInput.value.trim();

  const file =
  mediaInput.files[0];

  if(!title){

    showMessage(
      "Please enter a post title.",
      "error"
    );

    return;
  }

  if(!content){

    showMessage(
      "Please enter post content.",
      "error"
    );

    return;
  }

  if(file &&
     file.size > 50 * 1024 * 1024){

    showMessage(
      "File is larger than 50 MB.",
      "error"
    );

    return;
  }

  publishBtn.disabled = true;

  publishBtn.textContent =
  "Publishing...";

  try{

    let mediaUrl = null;


    /* =========================
       STORAGE UPLOAD
    ========================= */

    if(file){

      const safeName =
      file.name.replace(
        /[^a-zA-Z0-9.-]/g,
        "-"
      );

      const fileName =
      Date.now() + "-" + safeName;


      const { data, error } =
      await client.storage
      .from(BUCKET)
      .upload(
        fileName,
        file,
        {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        }
      );


      if(error){

        console.error(
          "Storage error:",
          error
        );

        throw new Error(
          "Storage upload failed: " +
          error.message
        );

      }


      mediaUrl =
      client.storage
      .from(BUCKET)
      .getPublicUrl(fileName)
      .data
      .publicUrl;

    }


    /* =========================
       CREATE POST
    ========================= */

    const { data, error } =
    await client
    .from("posts")
    .insert([
      {
        Title: title,
        Content: content,
        Image_url: mediaUrl
      }
    ])
    .select();


    if(error){

      console.error(
        "Database error:",
        error
      );

      throw new Error(
        "Database error: " +
        error.message
      );

    }


    /* =========================
       SUCCESS
    ========================= */

    showMessage(
      "Post published successfully! 🎉",
      "success"
    );

    titleInput.value = "";
    contentInput.value = "";
    mediaInput.value = "";
    preview.innerHTML = "";

    setTimeout(
      function(){

        window.location.href =
        "index.html";

      },
      1500
    );

  }

  catch(error){

    console.error(
      "ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Something went wrong.",
      "error"
    );

    publishBtn.disabled =
    false;

    publishBtn.textContent =
    "Publish Post";

  }

});


/* =========================
   MESSAGE
========================= */

function showMessage(
text,
type
){

  message.textContent =
  text;

  message.className =
  "message " + type;

}

</script>
