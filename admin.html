<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MK Youth Mobilizers - Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#222;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
}

.box{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.1);
  margin:20px auto;
}

h1,h2{
  text-align:center;
  color:#075b32;
}

.subtitle{
  text-align:center;
  color:#666;
  margin:8px 0 25px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.login-btn,
#publishBtn,
#saveLiveBtn{
  width:100%;
  margin-top:20px;
  background:#075b32;
  color:white;
  font-size:17px;
}

.logout-btn{
  background:#b00020;
  color:white;
  width:100%;
  margin-top:15px;
}

button:disabled{
  background:#999!important;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  line-height:1.5;
}

.success{
  color:#087f23;
}

.error{
  color:#b00020;
}

.preview{
  margin-top:15px;
  text-align:center;
}

.preview img,
.preview video{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:10px;
}

.post-card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:18px;
}

.post-card h3{
  color:#075b32;
  margin-bottom:8px;
}

.post-card p{
  white-space:pre-wrap;
  color:#555;
  line-height:1.5;
  margin-bottom:12px;
}

.post-card img,
.post-card video{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:10px;
}

.edit-btn{
  background:#075b32;
  color:white;
  flex:1;
}

.delete-btn{
  background:#b00020;
  color:white;
  flex:1;
}

.cancel-btn{
  display:none;
  width:100%;
  margin-top:10px;
  background:#777;
  color:white;
}

.back{
  display:block;
  text-align:center;
  margin:20px;
  color:#075b32;
  text-decoration:none;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

#adminArea{
  display:none;
}

.live-box{
  border:2px solid #ddd;
  border-radius:14px;
  padding:20px;
  margin-top:20px;
}

.live-title{
  text-align:center;
  color:#b00020;
  font-size:23px;
  font-weight:bold;
  margin-bottom:10px;
}

.live-status{
  text-align:center;
  padding:10px;
  border-radius:8px;
  background:#f1f1f1;
  margin-top:10px;
}

.remove-live{
  width:100%;
  margin-top:10px;
  background:#b00020;
  color:white;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="box" id="loginArea">

<h1>MK Youth Mobilizers</h1>

<p class="subtitle">
Admin Login
</p>

<label>Email</label>

<input
type="email"
id="loginEmail"
placeholder="Enter admin Gmail"
autocomplete="email"
>

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter admin password"
autocomplete="current-password"
>

<button
class="login-btn"
id="loginBtn"
>
🔐 Login
</button>

<div
id="loginMessage"
class="message"
></div>

</div>


<!-- ADMIN -->

<div id="adminArea">

<!-- POST -->

<div class="box">

<h1>MK Youth Mobilizers</h1>

<p
class="subtitle"
id="formTitle"
>
Create a new post
</p>

<label>Post Title</label>

<input
type="text"
id="title"
placeholder="Enter post title"
>

<label>Post Content</label>

<textarea
id="content"
placeholder="Write your post here..."
></textarea>

<label>Choose Photo or Video</label>

<input
type="file"
id="media"
accept="image/*,video/*"
>

<div
id="preview"
class="preview"
></div>

<button
id="publishBtn"
>
Publish Post
</button>

<button
id="cancelBtn"
class="cancel-btn"
>
Cancel Edit
</button>

<div
id="message"
class="message"
></div>

</div>


<!-- LIVE -->

<div class="box">

<div class="live-title">
🔴 YouTube LIVE
</div>

<p class="subtitle">
Paste your YouTube Live video link below.
</p>

<label>YouTube Live Link</label>

<input
type="text"
id="liveUrl"
placeholder="https://www.youtube.com/watch?v=XXXXXXXXXXX"
>

<button
id="saveLiveBtn"
>
🔴 Activate Live
</button>

<button
id="removeLiveBtn"
class="remove-live"
>
⏹️ End Live
</button>

<div
id="liveMessage"
class="message"
></div>

<div
id="liveStatus"
class="live-status"
>
Checking live status...
</div>

</div>


<!-- MANAGE POSTS -->

<div class="box">

<h2>
Manage Posts
</h2>

<div
id="posts"
style="margin-top:20px"
>

<div class="empty">
Loading posts...
</div>

</div>

</div>


<!-- LOGOUT -->

<div class="box">

<button
id="logoutBtn"
class="logout-btn"
>
🚪 Logout
</button>

</div>

</div>


<a
class="back"
href="index.html"
>
← Back to Website
</a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const BUCKET =
"post-media";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
ELEMENTS
========================= */

const loginArea =
document.getElementById("loginArea");

const adminArea =
document.getElementById("adminArea");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");

const titleInput =
document.getElementById("title");

const contentInput =
document.getElementById("content");

const mediaInput =
document.getElementById("media");

const preview =
document.getElementById("preview");

const publishBtn =
document.getElementById("publishBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const message =
document.getElementById("message");

const postsContainer =
document.getElementById("posts");

const formTitle =
document.getElementById("formTitle");

const liveUrl =
document.getElementById("liveUrl");

const saveLiveBtn =
document.getElementById("saveLiveBtn");

const removeLiveBtn =
document.getElementById("removeLiveBtn");

const liveMessage =
document.getElementById("liveMessage");

const liveStatus =
document.getElementById("liveStatus");


let editingId = null;
let oldMediaUrl = null;


/* =========================
MESSAGES
========================= */

function loginMsg(text,type){

loginMessage.textContent = text;

loginMessage.className =
"message " + type;

}


function showMessage(text,type){

message.textContent = text;

message.className =
"message " + type;

}


function liveMsg(text,type){

liveMessage.textContent = text;

liveMessage.className =
"message " + type;

}


/* =========================
LOGIN
========================= */

loginBtn.addEventListener(
"click",
async function(){

const email =
loginEmail.value.trim();

const password =
loginPassword.value;

if(!email || !password){

loginMsg(
"Please enter email and password.",
"error"
);

return;
}

loginBtn.disabled = true;

loginMsg(
"Logging in...",
"success"
);

const result =
await client.auth.signInWithPassword({
email:email,
password:password
});

loginBtn.disabled = false;

if(result.error){

loginMsg(
"❌ " + result.error.message,
"error"
);

return;
}

loginMsg(
"✅ Login successful!",
"success"
);

showAdmin();

});


/* =========================
SHOW ADMIN
========================= */

function showAdmin(){

loginArea.style.display =
"none";

adminArea.style.display =
"block";

loadPosts();

loadLive();

}


/* =========================
LOGOUT
========================= */

logoutBtn.addEventListener(
"click",
async function(){

await client.auth.signOut();

adminArea.style.display =
"none";

loginArea.style.display =
"block";

loginPassword.value =
"";

});


/* =========================
SESSION
========================= */

async function checkSession(){

const result =
await client.auth.getSession();

if(result.data.session){

showAdmin();

}

}

checkSession();


/* =========================
FILE PREVIEW
========================= */

mediaInput.addEventListener(
"change",
function(){

preview.innerHTML = "";

const file =
mediaInput.files[0];

if(!file) return;

if(file.size >
50 * 1024 * 1024){

showMessage(
"❌ File is larger than 50 MB.",
"error"
);

mediaInput.value = "";

return;
}

const url =
URL.createObjectURL(file);

if(file.type.startsWith("image/")){

const img =
document.createElement("img");

img.src = url;

preview.appendChild(img);

}

else if(file.type.startsWith("video/")){

const video =
document.createElement("video");

video.src = url;

video.controls = true;

preview.appendChild(video);

}

});


/* =========================
UPLOAD
========================= */

async function uploadMedia(file){

const safeName =
file.name.replace(
/[^a-zA-Z0-9.-]/g,
"-"
);

const fileName =
Date.now() +
"-" +
safeName;

const result =
await client.storage
.from(BUCKET)
.upload(
fileName,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);

if(result.error){

throw new Error(
"Storage upload failed: " +
result.error.message
);

}

return client.storage
.from(BUCKET)
.getPublicUrl(fileName)
.data
.publicUrl;

}


/* =========================
CREATE / UPDATE POST
========================= */

publishBtn.addEventListener(
"click",
async function(){

const title =
titleInput.value.trim();

const content =
contentInput.value.trim();

const file =
mediaInput.files[0];

if(!title){

showMessage(
"Please enter a post title.",
"error"
);

return;
}

if(!content){

showMessage(
"Please enter post content.",
"error"
);

return;
}

publishBtn.disabled = true;

try{

let mediaUrl =
oldMediaUrl;

if(file){

showMessage(
"Uploading media...",
"success"
);

mediaUrl =
await uploadMedia(file);

}

if(editingId){

const result =
await client
.from("posts")
.update({

Title:title,

Content:content,

Image_url:
mediaUrl || null

})
.eq(
"id",
editingId
);

if(result.error){
throw result.error;
}

showMessage(
"✅ Post updated successfully!",
"success"
);

}

else{

const result =
await client
.from("posts")
.insert([{

Title:title,

Content:content,

Image_url:
mediaUrl || null

}]);

if(result.error){
throw result.error;
}

showMessage(
"✅ Post published successfully!",
"success"
);

}

resetForm();

loadPosts();

}

catch(error){

console.error(error);

showMessage(
"❌ " + error.message,
"error"
);

}

publishBtn.disabled = false;

});


/* =========================
LOAD POSTS
========================= */

async function loadPosts(){

postsContainer.innerHTML =
'<div class="empty">Loading posts...</div>';

const result =
await client
.from("posts")
.select("*")
.order(
"id",
{
ascending:false
}
);

if(result.error){

postsContainer.innerHTML =
`<div class="empty">
❌ ${result.error.message}
</div>`;

return;
}

const posts =
result.data || [];

if(posts.length === 0){

postsContainer.innerHTML =
'<div class="empty">No posts yet.</div>';

return;

}

postsContainer.innerHTML = "";

posts.forEach(function(post){

const card =
document.createElement("div");

card.className =
"post-card";

if(post.Image_url){

const url =
post.Image_url;

const lower =
url.toLowerCase();

if(
lower.includes(".mp4") ||
lower.includes(".webm") ||
lower.includes(".mov") ||
lower.includes(".m4v")
){

const video =
document.createElement("video");

video.src = url;

video.controls = true;

card.appendChild(video);

}

else{

const img =
document.createElement("img");

img.src = url;

img.alt =
post.Title || "Post";

card.appendChild(img);

}

}

const title =
document.createElement("h3");

title.textContent =
post.Title || "Untitled";

const content =
document.createElement("p");

content.textContent =
post.Content || "";

card.appendChild(title);

card.appendChild(content);

const actions =
document.createElement("div");

actions.className =
"actions";

const editBtn =
document.createElement("button");

editBtn.className =
"edit-btn";

editBtn.textContent =
"✏️ Edit";

editBtn.onclick =
function(){

startEdit(post);

};

const deleteBtn =
document.createElement("button");

deleteBtn.className =
"delete-btn";

deleteBtn.textContent =
"🗑️ Delete";

deleteBtn.onclick =
function(){

deletePost(post);

};

actions.appendChild(editBtn);

actions.appendChild(deleteBtn);

card.appendChild(actions);

postsContainer.appendChild(card);

});

}


/* =========================
EDIT
========================= */

function startEdit(post){

editingId =
post.id;

oldMediaUrl =
post.Image_url || null;

titleInput.value =
post.Title || "";

contentInput.value =
post.Content || "";

mediaInput.value =
"";

preview.innerHTML = "";

formTitle.textContent =
"Edit Post";

publishBtn.textContent =
"Update Post";

cancelBtn.style.display =
"block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


cancelBtn.addEventListener(
"click",
resetForm
);


function resetForm(){

editingId = null;

oldMediaUrl = null;

titleInput.value = "";

contentInput.value = "";

mediaInput.value = "";

preview.innerHTML = "";

formTitle.textContent =
"Create a new post";

publishBtn.textContent =
"Publish Post";

cancelBtn.style.display =
"none";

}


/* =========================
DELETE
========================= */

async function deletePost(post){

const yes =
confirm(
"Are you sure you want to delete this post?"
);

if(!yes) return;

try{

const result =
await client
.from("posts")
.delete()
.eq(
"id",
post.id
);

if(result.error){
throw result.error;
}

showMessage(
"✅ Post deleted successfully.",
"success"
);

loadPosts();

}

catch(error){

showMessage(
"❌ Delete failed: " +
error.message,
"error"
);

}

}


/* =========================
YOUTUBE LIVE
========================= */

function getYouTubeId(url){

try{

const parsed =
new URL(url);

if(
parsed.hostname.includes("youtube.com")
){

return parsed.searchParams.get("v");

}

if(
parsed.hostname === "youtu.be"
){

return parsed.pathname.substring(1);

}

return null;

}

catch(error){

return null;

}

}


/* =========================
SAVE LIVE
========================= */

saveLiveBtn.addEventListener(
"click",
async function(){

const url =
liveUrl.value.trim();

if(!url){

liveMsg(
"❌ Paste your YouTube Live link first.",
"error"
);

return;
}

const videoId =
getYouTubeId(url);

if(!videoId){

liveMsg(
"❌ Invalid YouTube video link.",
"error"
);

return;
}

saveLiveBtn.disabled = true;

liveMsg(
"Saving Live...",
"success"
);

try{

const result =
await client
.from("live_stream")
.upsert(
{
id:1,
youtube_id:videoId,
active:true
}
);

if(result.error){

throw result.error;

}

liveMsg(
"✅ LIVE activated!",
"success"
);

liveStatus.textContent =
"🔴 LIVE IS ACTIVE";

}

catch(error){

liveMsg(
"❌ " + error.message,
"error"
);

}

saveLiveBtn.disabled = false;

});


/* =========================
END LIVE
========================= */

removeLiveBtn.addEventListener(
"click",
async function(){

const result =
await client
.from("live_stream")
.update({
active:false
})
.eq(
"id",
1
);

if(result.error){

liveMsg(
"❌ " + result.error.message,
"error"
);

return;

}

liveMsg(
"⏹️ Live ended.",
"success"
);

liveStatus.textContent =
"Live is currently OFF";

});


/* =========================
LOAD LIVE
========================= */

async function loadLive(){

const result =
await client
.from("live_stream")
.select("*")
.eq(
"id",
1
)
.maybeSingle();

if(result.error){

liveStatus.textContent =
"Live system not configured yet.";

return;
}

if(
result.data &&
result.data.active
){

liveUrl.value =
"https://www.youtube.com/watch?v=" +
result.data.youtube_id;

liveStatus.textContent =
"🔴 LIVE IS ACTIVE";

}

else{

liveStatus.textContent =
"Live is currently OFF";

}

}

</script>

</body>
</html>
