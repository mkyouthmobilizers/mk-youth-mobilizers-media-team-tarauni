<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reset Password - MK Youth Mobilizers</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  padding:20px;
}

.container{
  max-width:500px;
  margin:70px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.1);
}

h1{
  text-align:center;
  color:#075b32;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:8px;
  background:#075b32;
  color:white;
  font-size:17px;
  font-weight:bold;
}

#message{
  text-align:center;
  margin-top:20px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>
Reset Password
</h1>

<input
  type="password"
  id="password"
  placeholder="New password"
>

<input
  type="password"
  id="confirmPassword"
  placeholder="Confirm new password"
>

<button id="resetBtn">
Update Password
</button>

<div id="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://kszficrcngxipcllezgl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_hsMkfMvXMbAXXt8Z7LvAvg_52miDaJe";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const resetBtn =
document.getElementById("resetBtn");

const message =
document.getElementById("message");


resetBtn.addEventListener(
"click",
async function(){

  const password =
  document.getElementById(
    "password"
  ).value;

  const confirmPassword =
  document.getElementById(
    "confirmPassword"
  ).value;


  if(!password){

    message.textContent =
    "Please enter a new password.";

    return;
  }


  if(password.length < 6){

    message.textContent =
    "Password must be at least 6 characters.";

    return;
  }


  if(password !== confirmPassword){

    message.textContent =
    "Passwords do not match.";

    return;
  }


  resetBtn.disabled =
  true;

  resetBtn.textContent =
  "Updating...";


  const { error } =
  await client.auth.updateUser({
    password:password
  });


  if(error){

    message.textContent =
    "Error: " + error.message;

    resetBtn.disabled =
    false;

    resetBtn.textContent =
    "Update Password";

    return;
  }


  message.textContent =
  "✅ Password updated successfully!";


  resetBtn.textContent =
  "Success";


  setTimeout(
    function(){

      window.location.href =
      "admin.html";

    },
    1500
  );

});

</script>

</body>
</html>
